backend:
  name: git-gateway
  branch: main

media_library:
  name: cloudinary
  config:
    cloud_name: dgac7ammz
    api_key: 321396965257345

media_folder: assets/img
public_folder: assets/img

collections:
  - name: "textos"
    label: "Textos do Site"
    files:
      - name: "geral"
        label: "Textos Gerais"
        file: "content/site-texts.json"
        fields:
          - { label: "Nome (menu, hero e contato)", name: "siteName", widget: "string" }
          - { label: "Frase/Tagline", name: "tagline", widget: "string" }
          - { label: "Texto do botão 'Sobre'", name: "aboutButtonLabel", widget: "string" }
          - { label: "Título da Biografia", name: "biographyTitle", widget: "string" }
          - { label: "Parágrafos da Biografia", name: "biographyParagraphs", widget: "list" }
          - { label: "Telefone", name: "phone", widget: "string" }
          - { label: "E-mail", name: "email", widget: "string" }

  - name: "legendas"
    label: "Legendas das Fotos"
    files:
      - name: "Editorial-makeup"
        label: "Editorial Makeup"
        file: "content/Editorial-makeup.json"
        fields:
          - name: fotos
            label: Fotos
            widget: list
            fields:
              - { label: "Foto", name: "arquivo", widget: "image", media_library: { config: { folder: "Editorial-makeup" } } }
              - { label: "Legenda", name: "legenda", widget: "string", required: false }
              - { label: "Layout", name: "tipo", widget: "select", options: ["multi", "single"], default: "multi" }

      - name: "Editorial-fashion"
        label: "Editorial Fashion"
        file: "content/Editorial-fashion.json"
        fields:
          - name: fotos
            label: Fotos
            widget: list
            fields:
              - { label: "Foto", name: "arquivo", widget: "image", media_library: { config: { folder: "Editorial-fashion" } } }
              - { label: "Legenda", name: "legenda", widget: "string", required: false }
              - { label: "Layout", name: "tipo", widget: "select", options: ["multi", "single"], default: "multi" }

      - name: "Beauty-portraits"
        label: "Beauty Portraits"
        file: "content/Beauty-portraits.json"
        fields:
          - name: fotos
            label: Fotos
            widget: list
            fields:
              - { label: "Foto", name: "arquivo", widget: "image", media_library: { config: { folder: "Beauty-portraits" } } }
              - { label: "Legenda", name: "legenda", widget: "string", required: false }
              - { label: "Layout", name: "tipo", widget: "select", options: ["multi", "single"], default: "multi" }

      - name: "Advertising"
        label: "Advertising"
        file: "content/Advertising.json"
        fields:
          - name: fotos
            label: Fotos
            widget: list
            fields:
              - { label: "Foto", name: "arquivo", widget: "image", media_library: { config: { folder: "Advertising" } } }
              - { label: "Legenda", name: "legenda", widget: "string", required: false }
              - { label: "Layout", name: "tipo", widget: "select", options: ["multi", "single"], default: "multi" }